<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>HuQuMa Studio [Design+Build]</title>
    <meta name="description" content="Hugo Quintero Maldonado (HuQuMa) — Design and Build professional with 30+ years of experience in residential and commercial construction, public works, and real estate development. Based in Loreto, Baja California Sur, Mexico." />
    <meta property="og:title" content="HuQuMa Studio [Design+Build]" />
    <meta property="og:description" content="Design and Build professional with 30+ years of experience. Based in Loreto, Baja California Sur, Mexico." />
    <!-- og:image necesita URL absoluta: actualizar al migrar el dominio a huquma.studio -->
    <meta property="og:image" content="https://huquma-studio-website.vercel.app/images/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <!-- Imagen del Hero (LCP): se descarga en paralelo con el JS -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-cover-1920.webp"
      imagesrcset="/images/hero-cover-1080.webp 1080w, /images/hero-cover-1920.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <!-- Google Fonts: Cormorant Garamond + DM Sans + JetBrains Mono (solo los pesos en uso) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
